<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KeyVault AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- LOCK SCREEN -->
<div id="lockScreen" class="lockScreen">

  <div class="lockBox">
    <div class="bigIcon">🔐</div>
    <h1>KeyVault <span>AI</span></h1>
    <p>Your secure API key vault</p>

    <div class="locked">🔴 VAULT LOCKED</div>

    <input id="pin" type="password" maxlength="4"
           inputmode="numeric" placeholder="Enter PIN">

    <div id="pinError"></div>

    <button onclick="unlock()">🔓 Unlock Vault</button>
  </div>

</div>


<!-- MAIN APP -->
<div id="app" class="app">

  <header>
    <div class="logo">🔐</div>
    <div>
      <h2>KeyVault <span>AI</span></h2>
      <small>API KEY MANAGER</small>
    </div>

    <button class="lockBtn" onclick="lockVault()">🔒</button>
  </header>


  <section class="welcome">
    <small>SECURE DASHBOARD</small>
    <h1>Welcome back 👋</h1>
    <p>Manage your API keys and credentials.</p>
  </section>


  <div class="stats">

    <div class="card">
      🔑
      <small>API KEYS</small>
      <b id="count">0</b>
    </div>

    <div class="card">
      💵
      <small>BALANCE</small>
      <b>$0.00</b>
    </div>

    <div class="card">
      📊
      <small>USAGE</small>
      <b>0%</b>
    </div>

  </div>


  <!-- ADD KEY -->
  <div id="addBox" class="panel">

    <h2>🔑 Add API Key</h2>

    <input id="provider"
           placeholder="Provider (e.g. OpenAI)">

    <input id="keyName"
           placeholder="Key name">

    <input id="apiKey"
           type="password"
           placeholder="API key">

    <button onclick="saveKey()">💾 Save Key</button>

    <button class="cancel" onclick="closeAdd()">Cancel</button>

  </div>


  <!-- ACTIONS -->
  <div class="actions">

    <button onclick="openAdd()">➕ Add API Key</button>

    <button onclick="showKeys()">🔑 My Keys</button>

    <button onclick="showBalance()">💰 Balance</button>

    <button onclick="showSettings()">⚙️ Settings</button>

  </div>


  <!-- KEYS -->
  <section id="keysSection">

    <h2>My API Keys</h2>

    <div id="keys"></div>

  </section>


  <nav>
    <button onclick="goHome()">🏠<small>Home</small></button>
    <button onclick="showKeys()">🔑<small>Keys</small></button>
    <button onclick="showBalance()">💰<small>Balance</small></button>
    <button onclick="showSettings()">⚙️<small>Settings</small></button>
  </nav>

</div>

<script src="script.js"></script>

</body>
</html>
